[General]
name=Neo Strike Commander

[Window]
width=1920
height=1080
fullscreen=false

[Game]
object_detail = 0
world_detail = 0
show_texture = true
show_fog = true
max_view_distance = 160000
clouds_enabled = true
terrain_shadow_lift=15
terrain_shadow_range=35
terrain_flat=false

[Gameplay]
difficulty = 0

[Video]
fx_cpc_palette = false
fx_scanlines = false
fx_pixel_scale = 1
fx_fxaa = false
super_eagle_2x = true
widescreen_ambilight=true
; cockpit: 2d = classic 320x200 cockpit in the forward view (default), 3d = 3D virtual cockpit
; (the view you get with the cockpit key / right stick), forward view and F1 also use it
cockpit = 2d
; texture_filter: 0 = bilinear (default), 1 = mipmaps, 2 = mipmaps + anisotropic filtering
texture_filter = 0
; cockpit_metal: 1 = brushed metal texture on the flat grey surfaces of the 3D cockpit (fuselage, canopy rail), 0 = flat colours
cockpit_metal = 1
; camera_mouse: 1 = in the external views (F2 chase, F7 target, F8 missile) the mouse position orbits the camera around the plane, wheel = zoom, middle button = reset zoom
camera_mouse = 1
; camera_mouse_invert_y: 1 = mouse up raises the camera (view from above), 0 = mouse down raises it (like the F6 look)
camera_mouse_invert_y = 1
; g_effects: 1 = G-force vision in the cockpit views: tunnel vision, grey-out and blackout at high positive G, red-out at negative G
g_effects = 1
; g_effects_threshold: G load where the tunnel vision starts (full grey-out/blackout follows about 4 G above it)
g_effects_threshold = 5
; g_effects_strength: 0..2, scales all G effects
g_effects_strength = 1
ambilight_sample_width=6

[Input]
bindings_file = default_bindings.cfg

[Sound]
; midi_port: Raw-MIDI-Geraet (Linux), z.B. /dev/snd/midiC2D0. Leer = nur AdLib/OPL.
; midi_music: 0 = AdLib, 1 = General MIDI (SC-155), 2 = Roland MT-32
midi_port =
midi_music = 0
midi_debug = 0
; soundfont: SoundFont (.sf2) fuer General MIDI ohne Hardware, z.B. /usr/share/soundfonts/FluidR3_GM.sf2
; Wird nur genutzt bei midi_music = 1 und leerem midi_port.
soundfont =
