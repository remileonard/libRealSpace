[General]
name=Neo Strike Commander

[Window]
width=1920
height=1080
fullscreen=false

[Game]
object_detail = 0
world_detail = 0
show_texture = true
show_fog = true
max_view_distance = 160000
clouds_enabled = true
terrain_shadow_lift=15
terrain_shadow_range=35
terrain_flat=false

[Gameplay]
difficulty = 0

[Video]
fx_cpc_palette = false
fx_scanlines = false
fx_pixel_scale = 1
fx_fxaa = false
super_eagle_2x = true
widescreen_ambilight=true
ambilight_sample_width=6
; neosc_enhanced only: cockpit = 3d makes the forward and the left/right/rear views (F1, F3, F4, F5) use the 3D virtual cockpit, 2d = classic cockpit (default)
cockpit = 2d
; neosc_enhanced only: cockpit_fov = vertical field of view in degrees for the 3D cockpit views (45 = original, 55-65 shows more of the panel)
cockpit_fov = 45
; neosc_enhanced only: hd_textures = 1 replaces cockpit images by ./assets/hdtex/NAME_WxH.png (see resources/hdtex, copy it to assets/hdtex)
hd_textures = 0
; neosc_enhanced only: water_splash = 1 replaces explosions of shots and bombs that hit open sea by a splash (ring wave, spray, droplets)
water_splash = 0
; neosc_enhanced only: confirm_end_mission = 1 asks "Mission beenden?" before ESC ends a mission (0 = ESC ends it at once)
confirm_end_mission = 1
; neosc_enhanced only: camera_mouse_invert_y = 1 mouse up raises the orbiting external camera, 0 = mouse down raises it
camera_mouse_invert_y = 1

[Input]
bindings_file = default_bindings.cfg

[Sound]
; midi_port: Raw-MIDI-Geraet (Linux), z.B. /dev/snd/midiC2D0. Leer = nur AdLib/OPL.
; midi_music: 0 = AdLib, 1 = General MIDI (SC-155), 2 = Roland MT-32
midi_port =
midi_music = 0
midi_debug = 0
; soundfont: SoundFont (.sf2) fuer General MIDI ohne Hardware, z.B. /usr/share/soundfonts/FluidR3_GM.sf2
; Wird nur genutzt bei midi_music = 1 und leerem midi_port.
soundfont =
