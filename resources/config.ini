[General]
name=Neo Strike Commander

[Window]
width=1920
height=1080
fullscreen=false

[Game]
object_detail = 0
world_detail = 0
show_texture = true
show_fog = true
max_view_distance = 160000
clouds_enabled = false
terrain_shadow_lift=20
terrain_shadow_range=50
terrain_flat=false

[Gameplay]
difficulty = 0

[Video]
; overlay_offset + overlay_offset_distance: depth offset of the runway overlay against flicker (z-fighting) from a distance,
; units = overlay_offset + distance / overlay_offset_distance (a smaller distance value = stronger in the far)
overlay_offset = 200
overlay_offset_distance = 250
; exhaust_strength: afterburner flame of the enhanced F-16 in percent, 100 = original look, higher = longer, wider and brighter (50..300)
exhaust_strength = 100
fx_cpc_palette = false
fx_scanlines = false
fx_pixel_scale = 1
fx_fxaa = false
; msaa: 0 = off (default), 2, 4 or 8 = multisample anti-aliasing of the window framebuffer (needs a restart)
msaa = 0
; msaa_on / show_fps: switches of the options screen (ALT+O) of neosc_enhanced; msaa_on only turns the sampling of an existing msaa framebuffer on or off
msaa_on = 1
show_fps = 0
super_eagle_2x = true
widescreen_ambilight=true
; terrain_detail: 0 = off (default), 1..100 = strength of a fine detail texture over the whole terrain (grass, rock, water)
terrain_detail = 0
; water_waves: 0 = off (default), 1..100 = strength of two drifting wave layers on the water
water_waves = 0
; texture_filter: 0 = bilinear (default), 1 = mipmaps, 2 = mipmaps + anisotropic filtering (needs GL_EXT_texture_filter_anisotropic)
texture_filter = 0
; neosc_enhanced only: runway_texture: 0 = off (default), 1024 / 2048 / 4096 = procedural high resolution textures for the runway and taxiways (size of one tile)
runway_texture = 0
; neosc_enhanced and neops_enhanced only: cloud_shading: 0 = off (default, flat white clouds), 1..100 = clouds lit by the sun with soft sprites; the value is the contrast (needs clouds_enabled = true)
cloud_shading = 0
ambilight_sample_width=6
; neosc_enhanced only: cockpit = 3d makes the forward and the left/right/rear views (F1, F3, F4, F5) use the 3D virtual cockpit, 2d = classic cockpit (default)
cockpit = 2d
; neosc_enhanced only: cockpit_fov = vertical field of view in degrees for the 3D cockpit views (45 = original, 55-65 shows more of the panel)
cockpit_fov = 45
; neosc_enhanced only: hd_textures = 1 replaces cockpit images by ./assets/hdtex/NAME_WxH.png (see resources/hdtex, copy it to assets/hdtex)
hd_textures = 0
; neosc_enhanced only: water_splash = 1 replaces explosions of shots and bombs that hit open sea by a splash (ring wave, spray, droplets)
water_splash = 0
; neosc_enhanced only: camera_mouse_orbit = 1 lets the mouse orbit the external cameras (F2 etc.), 0 = original
camera_mouse_orbit = 1
; neosc_enhanced only: enhanced_f16_model = 1 uses the OBJ airframe from assets/models and the thrust dependent exhaust flame, 0 = original model and flame
enhanced_f16_model = 1
; neosc_enhanced only: camera_mouse_invert_y = 1 mouse up raises the orbiting external camera, 0 = mouse down raises it
camera_mouse_invert_y = 1
; neosc_enhanced only: cockpit_metal = 1 puts a brushed metal texture (streaks, seams, rivets) on the flat grey surfaces of the 3D cockpit model (needs cockpit = 3d), 0 = flat colours (default)
cockpit_metal = 0
; neosc_enhanced only: g_effects = 1 adds G-force vision in the first person views: tunnel vision, grey-out and blackout at high positive G, red-out at negative G (default 0 = off)
g_effects = 0
; neosc_enhanced only: g_effects_threshold = G load where the tunnel vision starts, 2..9 (full grey-out and blackout follow about 4 G above it)
g_effects_threshold = 6
; neosc_enhanced only: g_effects_strength = 0..2, scales all G effects
g_effects_strength = 0.6

[Input]
bindings_file = default_bindings.cfg
; menu_mouse_speed: speed of the mouse cursor in the menus in percent, 100 = follows the pointer 1:1 on the image,
; 200 = twice as fast (useful on large windows with a low resolution mouse), 25..1000
menu_mouse_speed = 100

[Sound]
; engine_volume: volume of the engine sound of the player's aircraft (0..128, default 100). The core sets that channel to 5 every frame,
; so the engine was hardly audible. -1 = unchanged (core behaviour). Only used by neosc_enhanced.
engine_volume = 100
; midi_port: Raw-MIDI-Geraet (Linux), z.B. /dev/snd/midiC2D0. Leer = nur AdLib/OPL.
; midi_music: 0 = AdLib, 1 = General MIDI (SC-155), 2 = Roland MT-32, 3 = Roland MT-32 emulation (libmt32emu)
midi_port = 
midi_music = 3
midi_debug = 0
; mt32_rom_dir: directory with the MT-32 (or CM-32L) control and PCM ROM images, used with midi_music = 3.
mt32_rom_dir = ./assets/mt32
; mt32_rhythm_setup: 1 = program the MT-32 rhythm setup like the original game: the 14 custom percussion timbres of STRIKE.MT
; (timbre slots 0..13) and the rhythm setup table of 29 keys. Used with midi_music = 2 or 3. 0 = off. Default 1 (only matters with midi_music = 2 or 3).
mt32_rhythm_setup = 1
; mt32_reverb_control: 1 = the reverb of the MT-32 follows the tunes like in the original game (mode, time and level come with the
; tunes as controllers 61, 62, 63 on MIDI channel 1 and are sent to the MT-32 as SysEx), used with midi_music = 2 or 3. 0 = off. Default 1.
mt32_reverb_control = 1
; Tuning of the emulated MT-32 (midi_music = 3), set towards a first generation MT-32 as heard on the real device.
; mt32_reverb_gain: gain of the reverb output, 2.0 = default here (libmt32emu: 1.0), range 0.1 .. 8.
mt32_reverb_gain = 2.0
; mt32_analog_mode: analog output stage, 0 = digital only, 1 = coarse (libmt32emu default), 2 = accurate (default here), 3 = accurate, oversampled.
mt32_analog_mode = 2
; mt32_dac_mode: DAC input, 0 = nice (libmt32emu default), 1 = pure (half volume), 2 = generation 1 = early MT-32 (default here), 3 = generation 2.
mt32_dac_mode = 2
; soundfont: SoundFont (.sf2) fuer General MIDI ohne Hardware, z.B. /usr/share/soundfonts/FluidR3_GM.sf2
; Wird nur genutzt bei midi_music = 1 und leerem midi_port.
soundfont =

[R4nkine]
shadows = true
shadow_map_size = 2048
shadow_distance = 1500
tree_shadows = false
forests = textures
forest_density = 0.5
buildings = true
texture_upscale = xbr4x
texture_mipmaps = true
anisotropy = 8
; VR (neosc_r4, OpenXR): the flight in the headset, the menus on a screen in front of the eyes. The menu button or a click of a stick recenters.
vr = false
; the size of the eyes (x the size that the runtime recommends) and their MSAA
vr_scale = 1
vr_msaa = 4
; the screen of the menus: its distance and its height in meters
vr_screen_distance = 2
vr_screen_height = 1.5
